$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
}

background {
    monitor =
    color = rgb(0, 0, 0)
}

input-field {
    monitor =
    size = 200, 40
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(38, 38, 38)
    inner_color = rgb(0, 0, 0)
    font_color = rgb(163, 163, 163)
    fade_on_empty = false
    placeholder_text = <span foreground="##525252">Password...</span>
    hide_input = false
    rounding = 4
    check_color = rgb(163, 163, 163)
    fail_color = rgb(248, 113, 113)
    fail_text = <span foreground="##f87171">$FAIL</span>
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = $font
    color = rgb(163, 163, 163)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 14
    font_family = $font
    color = rgb(82, 82, 82)
    position = 0, 50
    halign = center
    valign = center
}