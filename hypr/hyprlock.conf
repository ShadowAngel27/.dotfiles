$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = /home/shadow_angel/Pictures/Wallpapers/wallpaper.jpg
    blur_passes = 2
    blur_size = 7
    brightness = 0.6
    color = rgb(13, 13, 13)
}

input-field {
    monitor =
    size = 220, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(51, 51, 51)
    inner_color = rgb(13, 13, 13)
    font_color = rgb(224, 224, 224)
    fade_on_empty = false
    placeholder_text = <span foreground="##666666">Password...</span>
    hide_input = false
    rounding = 4
    check_color = rgb(224, 224, 224)
    fail_color = rgb(248, 113, 113)
    fail_text = <span foreground="##f87171">$FAIL</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(224, 224, 224)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 18
    font_family = $font
    color = rgb(102, 102, 102)
    position = 0, 100
    halign = center
    valign = center
}
